[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-eda"
version = "1.0.0"
description = "Exploratory data analysis toolkit and report generator for agribusiness data"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dashboard = ["streamlit>=1.50"]

[project.scripts]
agri-eda = "agri_eda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
